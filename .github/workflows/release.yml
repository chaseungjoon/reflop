name: Release

# Runs only when a v* tag is pushed. Nothing is released otherwise.
# The release is created as a DRAFT. It is published by
# scripts/sign-release.sh, which signs checksums.txt with the offline release
# key (never stored on GitHub) and uploads checksums.txt.sig. Installers and
# updaters refuse releases without a valid signature.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install hatchling
      - run: go test ./...
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          sha256sum --check checksums.txt
          test ! -e checksums.txt.sig || { echo "a signature exists before the offline signing step"; exit 1; }
          tar -xzf reflopd_${TAG#v}_linux_amd64.tar.gz
          ./reflopd version | tee /dev/stderr | grep -q "${TAG#v}"
          ls reflop-${TAG#v}-py3-none-any.whl
