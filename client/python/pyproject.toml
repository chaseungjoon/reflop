[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reflop"
dynamic = ["version"]
description = "reFLOP client: use a remote GPU as a calculator, without giving anyone a shell"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "The reFLOP Authors" }]
keywords = ["pytorch", "gpu", "remote", "sharing", "training"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.6",
  "protobuf>=5.29,<8",
  "cryptography>=42",
  "safetensors>=0.4",
  "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/chaseungjoon/reflop"
Documentation = "https://github.com/chaseungjoon/reflop/blob/main/docs/GUEST_GUIDE.md"
Changelog = "https://github.com/chaseungjoon/reflop/blob/main/CHANGELOG.md"
Issues = "https://github.com/chaseungjoon/reflop/issues"

[project.scripts]
reflop = "reflop.cli.main:main"

[tool.hatch.version]
path = "reflop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["reflop"]

[tool.hatch.build.targets.sdist]
include = ["reflop", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
