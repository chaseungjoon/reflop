# SPDX-License-Identifier: Apache-2.0
# Releases are cut only by pushing a v* tag (see .github/workflows/release.yml).
# The release is created as a draft: it becomes public only after
# scripts/sign-release.sh signs checksums.txt with the offline release key.
version: 2
project_name: reflopd

before:
  hooks:
    - go mod download
    # The Python client (wheel and sdist) ships in the same release, for
    # install.sh and `reflop update`. After signing, .github/workflows/pypi.yml
    # uploads these same files to PyPI.
    - sh -c 'sed -i "s/^__version__ = .*/__version__ = \"{{ .Version }}\"/" client/python/reflop/__init__.py'
    - sh -c 'rm -rf dist-python && python3 -m build --outdir dist-python client/python'

builds:
  - id: reflopd
    main: ./server/reflopd/cmd/reflopd
    binary: reflopd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/chaseungjoon/reflop/server/reflopd/internal/buildinfo.Version={{ .Version }}
      - -X github.com/chaseungjoon/reflop/server/reflopd/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/chaseungjoon/reflop/server/reflopd/internal/buildinfo.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE, README.md, CHANGELOG.md]

release:
  github:
    owner: chaseungjoon
    name: reflop
  prerelease: auto
  draft: true
  target_commitish: "{{ .FullCommit }}"
  extra_files:
    - glob: ./dist-python/reflop-*
  footer: |
    ## Install

    ```sh
    # Guest (macOS or Linux): the reflop client, in your project's environment
    uv add reflop=={{ .Version }}    # or: pip install reflop=={{ .Version }}
    # Guest: or with the installer (verifies this release's signature)
    curl -fsSL https://raw.githubusercontent.com/chaseungjoon/reflop/main/install.sh | sh
    # Owner (Linux, the machine with the GPU): reflopd
    curl -fsSL https://raw.githubusercontent.com/chaseungjoon/reflop/main/install.sh | sh -s -- --server
    ```

    Already installed? `reflop update` / `reflopd update`.

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./dist-python/reflop-*

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true
